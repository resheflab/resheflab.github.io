<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reshef Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #1f2933;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: #17202a;
    }

    .affiliations {
      margin-top: 28px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.8;
      font-weight: 400;
      color: #59636e;
    }

    .coming-soon {
      margin-top: 52px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8a939c;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Reshef Lab</h1>

    <div class="affiliations">
      <div>Brigham and Women's Hospital</div>
      <div>Harvard Medical School</div>
      <div>Broad Institute of MIT and Harvard</div>
    </div>

    <div class="coming-soon">
      Coming soon
    </div>
  </main>
</body>
</html>
